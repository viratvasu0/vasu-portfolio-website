name: Common Services Version Update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch (release/RC-*)"
        required: true
        default: "release/RC-2605"

jobs:
  common-services-update:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      # 🔹 1. Checkout common-services
      - name: Checkout common-services
        uses: actions/checkout@v4
        with:
          repository: your-org/csd-common-services
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GH_TOKEN }}
          path: csd-common-services

      # 🔹 2. Validate branch
      - name: Validate branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [[ ! "$BRANCH" =~ ^release/RC-.* ]]; then
            echo "Invalid branch. Only release/RC-* allowed"
            exit 1
          fi

      # 🔹 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      # 🔹 4. Install & Test
      - name: Install & Test
        run: |
          cd csd-common-services
          npm install
          npm test

      # 🔹 5. Extract version
      - name: Extract version
        run: |
          cd csd-common-services
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      # 🔹 6. Update dependent repositories (VM cmd logic equivalent)
      - name: Update dependent repositories
        run: |
          REPOS=(
            "csd-ocs-integration-lambda-build"
            "csd-ocs-event-bridge-build"
            "csd-ocs-appsync-lambda-build"
            "csd-ocs-integration-tools-build"
          )

          BASE_BRANCH="${{ github.event.inputs.branch }}"

          for REPO in "${REPOS[@]}"; do
            echo "===================================="
            echo "Processing $REPO"

            # Clone repo
            git clone https://x-access-token:${GH_TOKEN}@github.com/your-org/$REPO.git
            cd $REPO

            # Checkout base branch
            git checkout $BASE_BRANCH

            # Create feature branch
            FEATURE_BRANCH="feature/cs-${VERSION}"
            git checkout -b $FEATURE_BRANCH

            # Update version in package.json
            node -e "
              const fs = require('fs');
              const pkg = require('./package.json');
              if(pkg.dependencies && pkg.dependencies['@operations/csd-common-services']){
                pkg.dependencies['@operations/csd-common-services'] = '${VERSION}';
              }
              fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
            "

            # Commit changes
            git config user.name "github-actions"
            git config user.email "actions@github.com"

            git add package.json
            git commit -m "Updated common services version to ${VERSION}" || echo "No changes to commit"

            # Push branch
            git push origin $FEATURE_BRANCH

            # Create Pull Request
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/your-org/$REPO/pulls \
              -d "{
                \"title\": \"Update common-services version to ${VERSION}\",
                \"head\": \"${FEATURE_BRANCH}\",
                \"base\": \"${BASE_BRANCH}\",
                \"body\": \"Automated update of common-services version to ${VERSION}\"
              }"

            cd ..
          done

      # 🔹 7. Completion
      - name: Done
        run: echo "All repositories updated and PRs created successfully"